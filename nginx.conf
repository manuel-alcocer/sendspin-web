# Static PWA. The Sendspin WebSocket (/sendspin) is routed by the reverse proxy
# in front of this container straight to the Sendspin server, not through here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # the service worker and manifest must always be revalidated, or clients
    # keep an old app shell after a deploy
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # content-hashed build output
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
